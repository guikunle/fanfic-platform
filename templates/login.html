{% extends "base.html" %}
{% block title %}登录 🌸{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">🌸</div>
        <h1 class="auth-title">欢迎回来</h1>
        <p class="auth-subtitle">登录你的橹穆温暖小宇宙账号</p>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="输入你的用户名..." required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="输入密码..." required>
            </div>
            <button type="submit" class="auth-btn">🌸 登录</button>
        </form>
        <p class="auth-switch">
            还没有账号？<a href="{{ url_for('register') }}">点我注册 ✨</a>
        </p>
        <a href="{{ url_for('home') }}" class="auth-back">← 返回首页</a>
    </div>
</div>
{% endblock %}
